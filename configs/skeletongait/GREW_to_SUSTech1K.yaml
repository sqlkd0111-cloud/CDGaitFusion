# ===============================
# Cross-Domain Evaluation (GREW -> SUSTech1K)
# Pretrained: output/GREW/SkeletonGaitPP/SkeletonGaitPP/checkpoints/SkeletonGaitPP-180000.pt
# ===============================

data_cfg:
  dataset_name: SUSTech1K
  dataset_root: /home/user2/ljq/datasets/SUSTech1K/sil_heatmap  # 请按实际路径修改
  dataset_partition: ./datasets/SUSTech1K/SUSTech1K.json
  num_workers: 4
  data_in_use: [True, True, False]  # heatmap + silhouette
  remove_no_gallery: false
  test_dataset_name: SUSTech1K

evaluator_cfg:
  enable_float16: true
  restore_ckpt_strict: false
  restore_hint: output/GREW/SkeletonGaitPP/SkeletonGaitPP/checkpoints/SkeletonGaitPP-180000.pt
  save_name: SkeletonGaitPP_GREW_to_SUSTech1K_test
  eval_func: evaluate_indoor_dataset
  sampler:
    batch_shuffle: false
    batch_size: 4
    sample_type: all_ordered
    frames_all_limit: 720
  metric: euc
  transform:
    - type: BaseSilCuttingTransform

model_cfg:
  model: SkeletonGaitPP
  Backbone:
    in_channels: 2
    blocks: [1, 4, 4, 1]
    C: 2
  SeparateBNNecks:
    class_num: 20000  # 与 GREW 训练时一致
  enable_enhanced_fusion: false
  enable_temporal_enhancement: false

trainer_cfg:
  enable_float16: true
  restore_ckpt_strict: false
  with_test: true
