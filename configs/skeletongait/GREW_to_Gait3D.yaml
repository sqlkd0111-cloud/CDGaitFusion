# ===============================
# Cross-Domain Evaluation (GREW -> Gait3D)
# Pretrained: output/GREW/SkeletonGaitPP/SkeletonGaitPP/checkpoints/SkeletonGaitPP-180000.pt
# ===============================

data_cfg:
  dataset_name: Gait3D
  dataset_root: /root/autodl-tmp/Gait3D/sil_heatmap  # 请按实际路径修改
  dataset_partition: ./datasets/Gait3D/Gait3D.json
  num_workers: 4
  data_in_use: [True, True, False]  # heatmap + silhouette
  remove_no_gallery: false
  test_dataset_name: Gait3D

evaluator_cfg:
  enable_float16: true
  restore_ckpt_strict: false
  restore_hint: output/GREW/SkeletonGaitPP/SkeletonGaitPP/checkpoints/SkeletonGaitPP-180000.pt
  save_name: SkeletonGaitPP_GREW_to_Gait3D_test
  eval_func: evaluate_Gait3D
  sampler:
    batch_shuffle: false
    batch_size: 4
    sample_type: all_ordered
    frames_all_limit: 720
  metric: euc
  transform:
    - type: BaseSilTransform

model_cfg:
  model: SkeletonGaitPP
  Backbone:
    in_channels: 2
    blocks: [1, 4, 4, 1]
    C: 2
  SeparateBNNecks:
    class_num: 20000  # 与 GREW 训练时一致
  enable_enhanced_fusion: false
  enable_temporal_enhancement: false

trainer_cfg:
  enable_float16: true
  restore_ckpt_strict: false
  with_test: true
